name: Build AadiVault Windows Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography flask

      - name: Build Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --name "AadiVaultApp" app.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress

      - name: Generate Inno Setup Script
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=Aadi Vault
          AppVersion=1.0.0
          AppPublisher=Aditya
          DefaultDirName={autopf}\Aadi Vault
          DefaultGroupName=Aadi Vault
          UninstallDisplayIcon={app}\AadiVaultApp.exe
          OutputBaseFilename=AadiVault
          OutputDir=.
          Compression=lzma
          SolidCompression=yes
          ArchitecturesInstallIn64BitMode=x64
          DisableDirPage=auto
          DisableProgramGroupPage=auto

          [Files]
          Source: "dist\AadiVaultApp.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\Aadi Vault"; Filename: "{app}\AadiVaultApp.exe"
          Name: "{autodesktop}\Aadi Vault"; Filename: "{app}\AadiVaultApp.exe"
          "@
          Set-Content -Path installer.iss -Value $iss

      - name: Build Installer Package
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Commit New Installer
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AadiVault.exe
          git commit -m "Auto-build verified Windows Installer" || exit 0
          git push
