name: Build and Deploy Windows Installer to GitHub Pages

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pycryptodome pyinstaller

      - name: Build Executable with PyInstaller (Full Crypto Modules)
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --collect-all Crypto `
            --hidden-import=Crypto `
            --hidden-import=Crypto.Cipher `
            --hidden-import=Crypto.Cipher.AES `
            --hidden-import=Crypto.Cipher.PKCS1_OAEP `
            --hidden-import=Crypto.PublicKey.RSA `
            --hidden-import=Crypto.Random `
            --hidden-import=Crypto.Util.Padding `
            --hidden-import=Crypto.Protocol.KDF `
            --hidden-import=Crypto.Hash.SHA256 `
            app.py

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Generate Microsoft Store Compliant Inno Setup Script
        shell: pwsh
        run: |
          $issContent = @"
          [Setup]
          AppName=Aadi Vault
          AppVersion=1.0.0
          AppPublisher=Aditya Rai
          DefaultDirName={autopf}\Aadi Vault
          DefaultGroupName=Aadi Vault
          OutputDir=dist_installer
          OutputBaseFilename=AadiVaultSetup
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          DisableProgramGroupPage=yes
          CloseApplications=force
          RestartIfNeededByRun=no
          UninstallDisplayIcon={app}\app.exe

          [Tasks]
          Name: "desktopicon"; Description: "{cm:CreateDesktopIcon}"; GroupDescription: "{cm:AdditionalIcons}"

          [Files]
          Source: "dist\app\*"; DestDir: "{app}"; Flags: ignoreversion recursesubdirs createallsubdirs

          [Icons]
          Name: "{group}\Aadi Vault"; Filename: "{app}\app.exe"
          Name: "{autodesktop}\Aadi Vault"; Filename: "{app}\app.exe"; Tasks: desktopicon

          [Run]
          Filename: "{app}\app.exe"; Description: "{cm:LaunchProgram,Aadi Vault}"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path "installer.iss" -Value $issContent

      - name: Compile Installer to EXE
        run: ISCC.exe installer.iss

      - name: Prepare GitHub Pages Payload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path public
          Copy-Item -Path "dist_installer\AadiVaultSetup.exe" -Destination "public\AadiVaultSetup.exe"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
