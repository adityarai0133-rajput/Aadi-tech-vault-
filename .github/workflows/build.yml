name: Build and Deploy AadiVault Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pycryptodome cryptography flask

      - name: Build Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed `
            --collect-all Crypto `
            --hidden-import=Crypto `
            --hidden-import=Crypto.Cipher `
            --hidden-import=Crypto.Cipher.AES `
            --hidden-import=Crypto.Random `
            --name "AadiVaultApp" `
            app.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Generate Inno Setup Script
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=Aadi Vault
          AppVersion=1.0.0
          AppPublisher=Aditya Rai
          DefaultDirName={autopf}\Aadi Vault
          DefaultGroupName=Aadi Vault
          UninstallDisplayIcon={app}\AadiVaultApp.exe
          OutputBaseFilename=AadiVault
          OutputDir=public
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          CloseApplications=force
          RestartIfNeededByRun=no
          DisableDirPage=auto
          DisableProgramGroupPage=auto

          [Files]
          Source: "dist\AadiVaultApp.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\Aadi Vault"; Filename: "{app}\AadiVaultApp.exe"
          Name: "{autodesktop}\Aadi Vault"; Filename: "{app}\AadiVaultApp.exe"

          [Run]
          Filename: "{app}\AadiVaultApp.exe"; Description: "Launch Aadi Vault"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss

      - name: Build Installer Package
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Index HTML Page
        shell: pwsh
        run: |
          $html = @"
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=AadiVault.exe" />
            <title>Downloading Aadi Vault...</title>
          </head>
          <body>
            <h2>Downloading Aadi Vault...</h2>
            <p>If download doesn't start, <a href="AadiVault.exe">click here</a>.</p>
          </body>
          </html>
          "@
          Set-Content -Path "public\index.html" -Value $html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
