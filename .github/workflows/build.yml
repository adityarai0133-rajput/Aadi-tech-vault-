name: Build and Upload AadiVault EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography flask

      - name: Compile to EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --name "AadiVault" app.py

      - name: Upload to Release v1.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.0.0 dist\AadiVault.exe --clobber
          
