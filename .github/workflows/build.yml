name: Build and Deploy AadiTechVault Installer

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install pycryptodome flask "kivy[base]" kivy_deps.sdl2 kivy_deps.glew pyinstaller

      - name: Generate Spec and Build EXE
        run: |
          python -c "
          import os
          spec = '''# -*- mode: python ; coding: utf-8 -*-
          import os
          from PyInstaller.utils.hooks import collect_all
          from kivy.tools.packaging.pyinstaller_hooks import get_deps_minimal, get_factory_import_paths, hookspath

          block_cipher = None

          c_datas, c_bin, c_hid = collect_all('Crypto')
          f_datas, f_bin, f_hid = collect_all('flask')
          j_datas, j_bin, j_hid = collect_all('jinja2')
          w_datas, w_bin, w_hid = collect_all('werkzeug')

          kivy_deps = get_deps_minimal(video=None, audio=None)

          all_datas = c_datas + f_datas + j_datas + w_datas + kivy_deps.get('datas', [])
          if os.path.exists('templates'):
              all_datas.append(('templates', 'templates'))

          all_bin = c_bin + f_bin + j_bin + w_bin + kivy_deps.get('binaries', [])
          all_hid = c_hid + f_hid + j_hid + w_hid + kivy_deps.get('hiddenimports', []) + get_factory_import_paths()

          a = Analysis(
              ['app.py'],
              pathex=[],
              binaries=all_bin,
              datas=all_datas,
              hiddenimports=all_hid,
              hookspath=hookspath(),
              hooksconfig={},
              runtime_hooks=[],
              excludes=['kivy.garden', 'tkinter', 'unittest'],
              win_no_prefer_redirects=False,
              win_private_assemblies=False,
              cipher=block_cipher,
              noarchive=False,
          )

          pyz = PYZ(a.pure, a.zipped_data, cipher=block_cipher)

          exe = EXE(
              pyz,
              a.scripts,
              a.binaries,
              a.zipfiles,
              a.datas,
              [],
              name='app',
              debug=False,
              bootloader_ignore_signals=False,
              strip=False,
              upx=True,
              upx_exclude=[],
              runtime_tmpdir=None,
              console=False,
              disable_windowed_traceback=False,
              argv_emulation=False,
              target_arch=None,
              codesign_identity=None,
              entitlements_file=None,
          )
          '''
          with open('app.spec', 'w') as f:
              f.write(spec)
          "
          pyinstaller --noconfirm app.spec

      - name: Install Inno Setup
        run: choco install innosetup --no-progress

      - name: Generate Microsoft Store Compliant Inno Script
        shell: pwsh
        run: |
          $iss = @"
          [Setup]
          AppName=Aadi Vault
          AppVersion=1.0.0
          AppPublisher=Aditya Rai
          DefaultDirName={autopf}\Aadi Vault
          DefaultGroupName=Aadi Vault
          UninstallDisplayIcon={app}\app.exe
          OutputBaseFilename=AadiVault
          OutputDir=public
          Compression=lzma2/ultra64
          SolidCompression=yes
          PrivilegesRequired=lowest
          CloseApplications=force
          RestartIfNeededByRun=no
          DisableDirPage=auto
          DisableProgramGroupPage=auto

          [Files]
          Source: "dist\app.exe"; DestDir: "{app}"; Flags: ignoreversion

          [Icons]
          Name: "{autoprograms}\Aadi Vault"; Filename: "{app}\app.exe"
          Name: "{autodesktop}\Aadi Vault"; Filename: "{app}\app.exe"

          [Run]
          Filename: "{app}\app.exe"; Description: "Launch Aadi Vault"; Flags: nowait postinstall skipifsilent
          "@
          Set-Content -Path installer.iss -Value $iss

      - name: Compile Inno Setup Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss

      - name: Create Index HTML for Auto-Download
        shell: pwsh
        run: |
          $html = @"
          <!DOCTYPE html>
          <html>
          <head>
            <meta http-equiv="refresh" content="0; url=AadiVault.exe" />
            <title>Downloading Aadi Vault...</title>
          </head>
          <body>
            <h2>Downloading Aadi Vault...</h2>
            <p>If download doesn't start, <a href="AadiVault.exe">click here</a>.</p>
          </body>
          </html>
          "@
          Set-Content -Path "public\index.html" -Value $html

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
