name: Build and Push EXE to Repo

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography flask

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --name "AadiVault" app.py

      - name: Move EXE and Commit Directly to Repo
        run: |
          copy dist\AadiVault.exe AadiVault.exe
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add AadiVault.exe
          git commit -m "Auto-commit compiled AadiVault.exe" || exit 0
          git push
