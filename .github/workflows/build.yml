name: Build and Upload AadiVault EXE

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography flask

      - name: Build Windows Executable
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --name "AadiVault" app.py

      - name: Auto-Detect Release & Upload EXE
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $latestRelease = gh release list --limit 1 --json tagName --jq ".[0].tagName"
          if (-not $latestRelease) {
              Write-Host "No release found, creating v1.0.0..."
              gh release create v1.0.0 dist\AadiVault.exe --title "Aadi Vault v1.0.0" --notes "Official Aadi Vault Release"
          } else {
              Write-Host "Found existing release tag: $latestRelease. Uploading AadiVault.exe..."
              gh release upload $latestRelease dist\AadiVault.exe --clobber
          }
