name: Build and Release AadiVault EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography

      - name: Build Windows Executable
        shell: pwsh
        run: |
          $entryFile = Get-ChildItem -Filter *.py | Select-Object -First 1 -ExpandProperty Name
          if (-not $entryFile) {
              Write-Error "No python script found in repo root!"
              exit 1
          }
          Write-Host "Found entry file: $entryFile"
          pyinstaller --onefile --noconsole --name "AadiVault" $entryFile

      - name: Create Release and Upload EXE
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Aadi Vault v1.0.0 Release"
          draft: false
          prerelease: false
          files: dist/AadiVault.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
