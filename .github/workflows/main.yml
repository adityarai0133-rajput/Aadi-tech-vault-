name: Build and Upload AadiVault EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography flask

      - name: Build Standalone EXE
        run: |
          pyinstaller --noconfirm --onefile --windowed --add-data "templates;templates" --name "AadiVault" app.py

      - name: Upload EXE to Existing Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          files: dist/AadiVault.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
