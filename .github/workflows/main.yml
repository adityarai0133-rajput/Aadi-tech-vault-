name: Build Aadi Tech Vault EXE and APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. WINDOWS EXE BUILD JOB
  # ==========================================
  build-windows-exe:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flask pycryptodome pyinstaller kivy

      - name: Compile App with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "templates;templates" --name "Aadi_Tech_Vault" app.py

      - name: Zip the Output Directory
        run: |
          powershell Compress-Archive -Path dist/Aadi_Tech_Vault -DestinationPath dist/Aadi_Tech_Vault_v1.zip

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aadi_Tech_Vault_Windows_EXE
          path: dist/Aadi_Tech_Vault_v1.zip

  # ==========================================
  # 2. ANDROID APK BUILD JOB (KIVY + BUILDOZER)
  # ==========================================
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer cython kivy pycryptodome

      - name: Auto-Create or Update Buildozer Spec File
        run: |
          if [ ! -f buildozer.spec ]; then
            buildozer init
            sed -i 's/^title =.*/title = Aadi Tech Vault/' buildozer.spec
            sed -i 's/^package.name =.*/package.name = aaditechvault/' buildozer.spec
            sed -i 's/^package.domain =.*/package.domain = org.kyxgo/' buildozer.spec
            sed -i 's/^requirements =.*/requirements = python3,kivy,pycryptodome/' buildozer.spec
            sed -i 's/^orientation =.*/orientation = portrait/' buildozer.spec
          fi

      - name: Build Android APK with Buildozer
        run: |
          yes | buildozer -v android debug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aadi_Tech_Vault_Android_APK
          path: bin/*.apk
          retention-days: 7
