name: Build and Release AadiVault EXE

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller cryptography flask

      - name: Build Windows Executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --windowed --add-data "templates;templates" --name "AadiVault" app.py
          Compress-Archive -Path dist/AadiVault/* -DestinationPath dist/AadiVault.zip

      - name: Create or Update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Aadi Vault v1.0.0"
          draft: false
          prerelease: false
          files: |
            dist/AadiVault/AadiVault.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
